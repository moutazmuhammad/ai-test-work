{{- if .Values.dashboard.enabled }}

{{- $service := .Values.dashboard.service | default dict }}

apiVersion: v1
kind: Service

metadata:
  name: {{ template "nuclio.dashboardName" . }}
  labels:
    app: {{ template "nuclio.name" . }}
    release: {{ .Release.Name }}
    nuclio.io/app: dashboard
    nuclio.io/name: {{ template "nuclio.dashboardName" . }}
    nuclio.io/class: service

spec:
  selector:
    nuclio.io/name: {{ template "nuclio.dashboardName" . }}

  type: {{ $service.type | default "ClusterIP" }}

  ports:
    - name: admin
      port: 8070
      targetPort: 8070
      protocol: TCP

{{- if and (eq ($service.type | default "ClusterIP") "NodePort") $service.nodePort }}
      nodePort: {{ $service.nodePort }}
{{- end }}

{{- end }}