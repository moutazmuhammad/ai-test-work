  #       annotations:
  #         summary: "Redis has no master — writes are failing"
  #         description: "No node reports role=master. Sentinel failed to elect one; the redis-master Service has no endpoint and every write is rejected."

  #     - alert: RedisSplitBrain
  #       expr: count(redis_instance_info{namespace="aib-data", role="master"}) > 1
  #       for: 5m
  #       labels:
  #         severity: critical
  #       annotations:
  #         summary: "Redis reports {{ `{{ $value }}` }} masters"
  #         description: "More than one node claims role=master. Writes may be landing on a node that will be demoted and lose them."

  #     - alert: RedisReplicationBroken
