policyExceptions:

  # Upstream Kubeflow ships these platform deployments without ephemeral-storage
  # requests and (for some) CPU/memory limits, so a fresh Kubeflow install is
  # rejected at admission. Scoped to the named workloads rather than the whole
  # namespace, so any new component that omits them still gets caught.
  # Wildcards cover the generated ReplicaSet and Pod names.
  kubeflow-platform-resources:
    enabled: true
    exceptions:
      - policyName: aib-require-ephemeral-storage
        ruleNames:
          - require-ephemeral-storage-requests
          - autogen-require-ephemeral-storage-requests
      - policyName: require-resource-limits
        ruleNames:
          - validate-resource-limits
          - autogen-validate-resource-limits
          - validate-resource-limits-init
          - autogen-validate-resource-limits-init
    match:
      - kinds:
          - Pod
          - Deployment
          - ReplicaSet
        namespaces:
          - aib-system
        names:
          - "cache-server*"
          - "dashboard*"
          - "jupyter-web-app-deployment*"
          - "kubeflow-pipelines-profile-controller*"
          - "metadata-envoy-deployment*"
          - "metadata-grpc-deployment*"
          - "metadata-writer*"
          - "ml-pipeline-scheduledworkflow*"
          - "ml-pipeline-viewer-crd*"
          - "notebook-controller-deployment*"
          - "poddefaults-webhook-deployment*"
          - "profiles-deployment*"
          - "tensorboards-web-app-deployment*"
          - "volumes-web-app-deployment*"
          - "workflow-runner-*"

  kyverno-system:
    enabled: true
    exceptions:
      - policyName: restrict-privilege-escalation
        ruleNames:
          - deny-priv-esc-containers
          - autogen-deny-priv-esc-containers
          - deny-priv-esc-init
          - autogen-deny-priv-esc-init
      - policyName: disallow-root-user
        ruleNames:
          - deny-root-containers
          - autogen-deny-root-containers
          - deny-root-init-containers
          - autogen-deny-root-init-containers
      - policyName: enforce-readonly-root-filesystem
        ruleNames:
          - require-readonly-fs-containers
          - autogen-require-readonly-fs-containers
          - require-readonly-fs-init
          - autogen-require-readonly-fs-init
      - policyName: require-drop-all-capabilities
        ruleNames:
          - require-drop-all
          - autogen-require-drop-all
      - policyName: restrict-linux-capabilities
        ruleNames:
          - restrict-added-capabilities
          - autogen-restrict-added-capabilities
      - policyName: require-resource-limits
        ruleNames:
          - validate-resource-limits
          - autogen-validate-resource-limits
          - validate-resource-limits-init
          - autogen-validate-resource-limits-init
    match:
      - kinds:
          - Pod
          - Deployment
          - ReplicaSet
          - Job
          - CronJob
        namespaces:
          - kyverno

  istio-gateway-readonly-rootfs:
    enabled: true
    exceptions:
      - policyName: enforce-readonly-root-filesystem
        ruleNames:
          - require-readonly-fs-containers
          - autogen-require-readonly-fs-containers
          - require-readonly-fs-init
          - autogen-require-readonly-fs-init
    match:
      - kinds:
          - Pod
