          - autogen-validate-resource-limits
          - validate-resource-limits-init
          - autogen-validate-resource-limits-init
      - policyName: enforce-readonly-root-filesystem
        ruleNames:
          - require-readonly-fs-containers
          - autogen-require-readonly-fs-containers
          - require-readonly-fs-init
          - autogen-require-readonly-fs-init
      - policyName: require-drop-all-capabilities
        ruleNames:
          - require-drop-all
          - autogen-require-drop-all
    # MLRun builds with kaniko too, under a different name. Without the
