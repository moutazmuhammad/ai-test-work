        matchLabels:
          app: kube-prometheus-stack-operator
      ingress:
        - ports:
            - protocol: TCP
              port: 10250 # kube-apiserver -> PrometheusRule admission webhook


#################### external-secrets ####################
  - name: deny-all
    namespace: external-secrets
    spec:
      podSelector: {}
      policyTypes:
        - Ingress
        - Egress
      egress:
        - ports:
            - protocol: UDP # DNS resolution
              port: 53
            - protocol: TCP # DNS resolution
              port: 53
            - protocol: TCP # GKE metadata server (Workload Identity) / AWS IMDS (IRSA)
              port: 80
            - protocol: TCP # kube-api server & external cloud providers if required
              port: 443
            - protocol: TCP # GKE Workload Identity metadata server
              port: 988
            - protocol: TCP # istio (mTLS)
              port: 15012
            - protocol: TCP # istio (Plaintext)
              port: 15010
            - protocol: TCP # istio healthcheck
              port: 15021
      ingress:
        - ports:
            - protocol: TCP
              port: 15021 # istio healthcheck
            - protocol: TCP
              port: 10250 # webhook


