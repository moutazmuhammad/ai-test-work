          - ReplicaSet
        namespaces:
          - istio-system
        names:
          - "istio-ingressgateway*"
          - "istio-egressgateway*"

  nuclio-kaniko-build-jobs:
    enabled: true
    exceptions:
      - policyName: disallow-root-user
        ruleNames:
          - deny-root-containers
          - autogen-deny-root-containers
          - deny-root-init-containers
          - autogen-deny-root-init-containers
      - policyName: restrict-privilege-escalation
        ruleNames:
          - deny-priv-esc-containers
          - autogen-deny-priv-esc-containers
          - deny-priv-esc-init
          - autogen-deny-priv-esc-init
      - policyName: require-resource-limits
        ruleNames:
