        - Egress
      egress:
        - ports:
            - protocol: UDP # DNS resolution
              port: 53
            - protocol: TCP # DNS resolution
              port: 53
            - protocol: TCP # kube-api server — watches PolicyReport/ClusterPolicyReport CRs
              port: 443
      ingress: []
