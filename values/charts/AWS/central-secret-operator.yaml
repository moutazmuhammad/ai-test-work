# =============================================================================
# Central Secret Operator — AWS overrides
#
# - googleCloud disabled, AWS enabled
# - IRSA for AWS authentication
# - SeaweedFS secrets removed (using S3 instead)
# - nuclio-push handled by ECR token generator (not in secrets list)
# - Grafana/Prometheus TLS certs removed (terminated at the AWS load balancer)
# - SeaweedFS TLS certs removed (minio, s3 subdomains)
# =============================================================================

serviceAccount:
  create: false
  name: external-secrets
  namespace: external-secrets

clusterSecretStore:
  name: cluster-secret-store

googleCloud:
  enabled: false

aws:
  enabled: true
  authMethod: podIdentity
  setupIAM:
    enabled: false
    region: af-south-1
    accountId: "490083271972"
    roleName: external-secrets-operator-role
    policyName: ESO-SecretsManager-Policy
    iamRoleArn: arn:aws:iam::490083271972:role/aibplus-aib-secrets-role # Change by AIB+ Market
    image:
      repository: 490083271972.dkr.ecr.af-south-1.amazonaws.com/aibplus-images/aws-cli
      tag: "2.17.16"
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  # ECR token auto-refresh CronJob — refreshes nuclio-push secret every 10h
  ecrTokenGenerator:
    enabled: true
    name: ecr-token-generator
    region: af-south-1
    registry: "490083271972.dkr.ecr.af-south-1.amazonaws.com"
    namespace: external-secrets
    targetNamespace: aib-system
    targetSecretName: nuclio-push
    schedule: "0 */10 * * *"
    awsCliImage:
      repository: 490083271972.dkr.ecr.af-south-1.amazonaws.com/aibplus-images/aws-cli
      tag: "2.17.16"
    kubectlImage:
      repository: 490083271972.dkr.ecr.af-south-1.amazonaws.com/aibplus-images/bitnami-kubectl
      tag: "v2-fixed"
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# secrets is a list — full replacement required
secrets:
  ## OAuth2
  - name: eso-oauth2-proxy-secret
    namespace: aib-auth
    targetName: oauth2-proxy-secret
    targetType: Opaque
    refreshInterval: 1h
    data:
      - secretKey: OAUTH2_PROXY_CLIENT_ID
        remoteRef:
          key: aibplus/deployment/oauth2-proxy-secret
          property: OAUTH2_PROXY_CLIENT_ID

      - secretKey: OAUTH2_PROXY_CLIENT_SECRET
        remoteRef:
          key: aibplus/deployment/oauth2-proxy-secret
          property: OAUTH2_PROXY_CLIENT_SECRET

      - secretKey: OAUTH2_PROXY_COOKIE_SECRET
        remoteRef:
          key: aibplus/deployment/oauth2-proxy-secret
          property: OAUTH2_PROXY_COOKIE_SECRET


  ## Dex
  - name: eso-dex-secret
    namespace: aib-auth
    targetName: dex-secret
    targetType: Opaque
    refreshInterval: 1h
    data:
      - secretKey: DEX_OAUTH2_PROXY_CLIENT_ID
        remoteRef:
          key: aibplus/deployment/dex-secret
          property: DEX_OAUTH2_PROXY_CLIENT_ID

      - secretKey: DEX_OAUTH2_PROXY_CLIENT_SECRET
        remoteRef:
          key: aibplus/deployment/dex-secret
          property: DEX_OAUTH2_PROXY_CLIENT_SECRET

      - secretKey: DEX_OIDC_CLIENT_ID
        remoteRef:
          key: aibplus/deployment/dex-secret
          property: DEX_OIDC_CLIENT_ID

      - secretKey: DEX_OIDC_CLIENT_SECRET
        remoteRef:
          key: aibplus/deployment/dex-secret
          property: DEX_OIDC_CLIENT_SECRET


  ## MySQL credentials
  - name: eso-mysql-credentials
    namespace: aib-data
    targetName: mysql-credentials
    targetType: Opaque
    refreshInterval: 1h
    data:
      - secretKey: mysql-root-password
        remoteRef:
          key: aibplus/deployment/mysql-credentials
          property: mysql-root-password

      - secretKey: mysql-replication-password
        remoteRef:
          key: aibplus/deployment/mysql-credentials
          property: mysql-replication-password

      - secretKey: mysql-password
        remoteRef:
          key: aibplus/deployment/mysql-credentials
          property: mysql-password

      - secretKey: KUBEFLOW_DB_PASSWORD
        remoteRef:
          key: aibplus/deployment/mysql-credentials
          property: KUBEFLOW_DB_PASSWORD

      - secretKey: MLRUN_DB_PASSWORD
        remoteRef:
          key: aibplus/deployment/mysql-credentials
          property: MLRUN_DB_PASSWORD


  ## Kubeflow → MySQL
  - name: eso-mysql-secret
    namespace: aib-system
    targetName: mysql-secret
    targetType: Opaque
    refreshInterval: 1h
    data:
      - secretKey: username
        remoteRef:
          key: aibplus/deployment/mysql-secret
          property: username

      - secretKey: password
        remoteRef:
          key: aibplus/deployment/mysql-secret
          property: password


  ## Kubeflow Pipelines → S3
  - name: eso-mlpipeline-minio-artifact
    namespace: aib-system
    targetName: mlpipeline-minio-artifact
    targetType: Opaque
    refreshInterval: 1h
    data:
      - secretKey: accesskey
        remoteRef:
          key: aibplus/deployment/mlpipeline-minio-artifact
          property: accesskey

      - secretKey: secretkey
        remoteRef:
          key: aibplus/deployment/mlpipeline-minio-artifact
          property: secretkey


  ## MLRun → MySQL DSN
  - name: eso-mlrun-db
    namespace: aib-system
    targetName: mlrun-db
    targetType: Opaque
    refreshInterval: 1h
    data:
      - secretKey: dsn
        remoteRef:
          key: aibplus/deployment/mlrun-db
          property: dsn

      - secretKey: oldDsn
        remoteRef:
          key: aibplus/deployment/mlrun-db
          property: oldDsn


  # minio-credentials REMOVED — MLRun and notebooks use IRSA for S3 access
  # (no static AWS keys needed, SA assumes IAM role aibplus-{market}-secret-role)

  ## MLRun → Redis
  - name: eso-mlrun-redis-credentials
    namespace: aib-system
    targetName: mlrun-redis-credentials
    targetType: Opaque
    refreshInterval: 1h
    data:
      - secretKey: MLRUN_REDIS__URL
        remoteRef:
          key: aibplus/deployment/mlrun-redis-credentials
          property: MLRUN_REDIS__URL

      - secretKey: REDIS_USER
        remoteRef:
          key: aibplus/deployment/mlrun-redis-credentials
          property: REDIS_USER

      - secretKey: REDIS_PASSWORD
        remoteRef:
          key: aibplus/deployment/mlrun-redis-credentials
          property: REDIS_PASSWORD


  ## Redis
  - name: eso-redis-credentials
    namespace: aib-data
    targetName: redis-credentials
    targetType: Opaque
    refreshInterval: 1h
    data:
      - secretKey: redis-password
        remoteRef:
          key: aibplus/deployment/redis-credentials
          property: redis-password

  ## Grafana — admin login for kube-prometheus-stack
  - name: eso-grafana-credentials
    namespace: aib-ops
    targetName: grafana-credentials
    targetType: Opaque
    refreshInterval: 1h
    data:
      - secretKey: admin-user
        remoteRef:
          key: aibplus/deployment/grafana-credentials
          property: admin-user
      - secretKey: admin-password
        remoteRef:
          key: aibplus/deployment/grafana-credentials
          property: admin-password


  ## Alertmanager — OpCo webhook URL for kube-prometheus-stack
  ## Mounted (not env-injected) via alertmanager.alertmanagerSpec.secrets so the
  ## URL never appears in git or in the rendered Alertmanager config.
  ## The `url` property must be the full Lambda function URL, and that function
  ## URL must use AWS_IAM auth — auth type NONE is a public endpoint that anyone
  ## can post forged alerts to.
  - name: eso-alertmanager-opco-webhook
    namespace: aib-ops
    targetName: alertmanager-opco-webhook
    targetType: Opaque
    refreshInterval: 1h
    data:
      - secretKey: url
        remoteRef:
          key: aibplus/deployment/alertmanager-opco-webhook
          property: url
