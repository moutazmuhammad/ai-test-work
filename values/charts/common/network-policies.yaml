networkPolicies:
##########################################################
######################## aib-auth ########################
  - name: deny-all
    namespace: aib-auth
    spec:
      podSelector: {}
      policyTypes:
        - Ingress
        - Egress
      egress:
        - ports:
            - protocol: UDP # DNS resolution
              port: 53
            - protocol: TCP # DNS resolution
              port: 53
            - protocol: TCP # calling external endpoints like oauth2, dex, NAM
              port: 443
            - protocol: TCP # istio (mTLS)
              port: 15012
            - protocol: TCP # istio (Plaintext)
              port: 15010
            - protocol: TCP # istio healthcheck
              port: 15021
      ingress:
        - ports:
            - protocol: TCP
              port: 15021 # istio healthcheck
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: aib-ops
              podSelector: {}
          ports:
            - protocol: TCP # istio metrics
              port: 15020 
######################## oauth2-proxy
  - name: oauth2-proxy
    namespace: aib-auth
    spec:
      podSelector:
        matchLabels:
          app: oauth2-proxy
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: istio-system
              podSelector:
                matchLabels:
                  app: istio-ingressgateway # external traffic directly to oauth2-proxy
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: aib-system
              podSelector: {} # most pods in aib-system namespace call oauth2-proxy
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: aibplus-profile
              podSelector: {} # notebooks in aibplus-profile namespace call oauth2-proxy
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: aib-data
              podSelector:
                matchLabels:
                  app.kubernetes.io/component: admin
          ports:
            - protocol: TCP
              port: 4180

######################## dex
  - name: dex
    namespace: aib-auth
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: dex
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: istio-system
              podSelector:
                matchLabels:
                  app: istio-ingressgateway # external traffic directly to dex
          ports:
            - protocol: TCP
              port: 5556


##########################################################
######################## aib-data ########################
  - name: deny-all
    namespace: aib-data
    spec:
      podSelector: {}
      policyTypes:
        - Ingress
        - Egress
      egress:
        - ports:
            - protocol: UDP # DNS resolution
              port: 53
            - protocol: TCP # DNS resolution
              port: 53
            - protocol: TCP # istio (mTLS)
              port: 15012
            - protocol: TCP # istio (Plaintext)
              port: 15010
            - protocol: TCP # oauth2-proxy
              port: 4180
            - protocol: TCP # istio healthcheck
              port: 15021
      ingress:
        - ports:
            - protocol: TCP
              port: 15021 # istio healthcheck
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: aib-ops
              podSelector: {}
          ports:
            - protocol: TCP # istio metrics
              port: 15020
######################## mysql
  - name: mysql
    namespace: aib-data
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: mysql
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: aib-system
              podSelector: {} # most pods in aib-system namespace call mysql
            - podSelector:
                matchLabels:
                    app.kubernetes.io/name: seaweedfs
          ports:
            - protocol: TCP
              port: 3306
        # mysqld-exporter on both mysql releases, scraped by the aib-ops Prometheus.
        # Match on /name: the pod's /instance is kube-prometheus-stack-prometheus.
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: aib-ops
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: prometheus
          ports:
            - protocol: TCP # mysqld-exporter metrics
              port: 9104
######################## intra-mysql
  - name: intra-mysql                                                                          
    namespace: aib-data
    spec:
      podSelector:
        matchLabels:                                                                           
          app.kubernetes.io/name: mysql
      policyTypes:                                                                             
        - Ingress
        - Egress
      ingress:
      - from:
        - podSelector:                                                                         
            matchLabels:
              app.kubernetes.io/name: mysql                                                    
        ports:                                                                                 
        - port: 3306
          protocol: TCP
      egress:
      - to:                                                                                    
        - podSelector:
            matchLabels:                                                                       
              app.kubernetes.io/name: mysql                                                    
        ports:
        - port: 3306
          protocol: TCP

######################## seaweedfs
  - name: seaweedfs
    namespace: aib-data
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: seaweedfs
      policyTypes:
        - Ingress
        - Egress
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: aib-system
              podSelector: {} # most pods in aib-system namespace call seaweedfs
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: aib-serving
              podSelector: {} # nuclio functions
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: aibplus-profile
              podSelector: {} # notebooks in aibplus-profile namespace call seaweedfs
          ports:
            - protocol: TCP
              port: 8333
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: istio-system
              podSelector:
                matchLabels:
                  app: istio-ingressgateway # external traffic directly to seaweedfs ui
          ports:
            - protocol: TCP
              port: 23646
      egress:
        - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: mysql
          ports:
            - protocol: TCP
              port: 3306
######################## intra-seaweedfs
  - name: intra-seaweedfs
    namespace: aib-data
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: seaweedfs
      policyTypes:
        - Ingress
        - Egress
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: seaweedfs
            - podSelector:
                matchLabels:
                  app.kubernetes.io/instance: seaweedfs
      egress:
        - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: seaweedfs
            - podSelector:
                matchLabels:
                  app.kubernetes.io/instance: seaweedfs
  - name: intra-seaweedfs-hook
    namespace: aib-data
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: seaweedfs
      policyTypes:
        - Ingress
        - Egress
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: seaweedfs
            - podSelector:
                matchLabels:
                  app.kubernetes.io/instance: seaweedfs
      egress:
        - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: seaweedfs
            - podSelector:
                matchLabels:
                  app.kubernetes.io/instance: seaweedfs
######################## redis
  - name: redis
    namespace: aib-data
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: redis
      policyTypes:
        - Ingress
        - Egress
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: aib-system
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: mlrun
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: aib-serving
              podSelector: {}
          ports:
            - protocol: TCP
              port: 6379
        # Sentinel gossip + replication between the redis node pods themselves.
        - from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: redis
          ports:
            - protocol: TCP # redis replication
              port: 6379
            - protocol: TCP # sentinel
              port: 26379
        # redis-exporter sidecar, scraped by the aib-ops Prometheus.
        # NOTE: kube-prometheus-stack labels the pod
        # app.kubernetes.io/instance=kube-prometheus-stack-prometheus, so match on /name instead — /instance: prometheus matches nothing.
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: aib-ops
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: prometheus
          ports:
            - protocol: TCP # redis-exporter metrics
              port: 9121
      egress:
        - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: redis
          ports:
            - protocol: TCP # redis replication
              port: 6379
            - protocol: TCP # sentinel
              port: 26379
        # kubectl sidecar moves the isMaster label after a failover, so the redis-master Service follows the newly elected master.
        - ports:
            - protocol: TCP # kube-apiserver
              port: 443


