#################### aib-governance ####################

# Policy Reporter watches PolicyReport CRs via the kube-apiserver, not Kyverno pods.
# VERIFY ports against the actual policy-reporter Helm chart version.
  - name: deny-all
    namespace: aib-governance
    spec:
      podSelector: {}
      policyTypes:
