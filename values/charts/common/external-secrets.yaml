# Images — external-secrets GAR overrides and issuer.
# Source of defaults: charts/cert-manager/values.yaml (Chart.yaml annotations).


serviceAccount:
  name: external-secrets-cluster-sa
  annotations:
    iam.gke.io/gcp-service-account: ml-product-eso-sa@vf-grp-aibplus-dev-mlproduct.iam.gserviceaccount.com

## Main Controller
image:
  repository: europe-west1-docker.pkg.dev/vf-grp-aib-dev-mirror/aib-plus-images/external-secrets
  tag: v2.4.1
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

## Webhook Component
webhook:
  image:
    repository: europe-west1-docker.pkg.dev/vf-grp-aib-dev-mirror/aib-plus-images/external-secrets
    tag: v2.4.1
    pullPolicy: IfNotPresent

  certManager:
    cert:
      create: true
      issuerRef:
        group: cert-manager.io
        kind: "Issuer"
        name: "external-secrets-issuer"
  
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi


## Cert Controller Component
certController:
  image:
    repository: europe-west1-docker.pkg.dev/vf-grp-aib-dev-mirror/aib-plus-images/external-secrets
    tag: v2.4.1
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
