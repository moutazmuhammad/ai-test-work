serviceAccount:
  create: true

  # Kubernetes service account which will work as workloadIdentityUser
  name: eso-service-account

  # namespace where create kubernetes service account created
  namespace: default


## Cluster secret store which will be used across cluster to fetch secrets from Secret Manager
clusterSecretStore:
    name: cluster-secret-store

    #This is the project ID where secrets are restored - GCP or AWS Secret Manager project ID
    targetProjectId: vf-grp-aibplus-dev-shared-svcs


googleCloud:
  # set this true if you have GCP platform for product
  enabled: true                 
  
  # This is an IAM set up to create GCP SA with secreterAccess role and binding it with Kubernetes SA  
  # Set this to 'true' if set up is not done already -- refer gcp-iam-job.yaml for more details
  setupIAM:
    enabled: false
    # This is product project ID
    projectId: vf-grp-aibplus-dev-mlproduct

    # Google Cloud service account name which should be created
    serviceAccountName: ml-product-eso-sa

    image:
      repository: google/cloud-sdk
      tag: slim
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi


aws:
  # set this true if you have AWS platform for product
  enabled: false

  # Auth method: "podIdentity" (EKS Pod Identity) or "irsa" (IAM Roles for Service Accounts)
  authMethod: irsa

  setupIAM:
    enabled: false
    region: eu-west-1

    # Your 12-digit AWS Account ID
    accountId: 123456789012

    # The OIDC ID from your EKS cluster
    # Example: oidc.eks.eu-west-1.amazonaws.com/id/EXAMPLED539D4633E53DE1B71EXAMPLE
    oidcProvider: ""

    # The name you want for the IAM Role and Policy
    roleName: external-secrets-operator-role
    policyName: ESO-SecretsManager-Policy
    iamRoleArn: arn:aws:iam::123456789012:role/external-secrets-operator-role

    image:
      repository: amazon/aws-cli
      tag: "2.17.16"
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi


secrets:
  ## ArgoCD secrets to be created for the product                     
  # external secret name for ESO
  - name: eso-argocd-agent-ca
    namespace: argocd
    # actual kubernetes secret name you targeted to create in the cluster             
    targetName: argocd-agent-ca  
    # type of kubernetes secret, it can be Opaque, tls, etc..         
    targetType: Opaque
    refreshInterval: 1h
    data:
        # key name inside the kubernetes secret in the cluster
      - secretKey: tls.crt              
        remoteRef:
          # name of secret in GCP/AWS Secret Manager
          key: argocd-agent-ca 
          # name of field inside GCP/AWS Secret Manager         
          property: tls.crt
          # version of secret you want to access
          version: latest
          # optional: provide if you have encoded secrets in the Secrets Manager
          decodingStrategy: Base64
    
  - name: eso-agent-tls-secret
    namespace: argocd
    targetName: argocd-agent-client-tls
    targetType: kubernetes.io/tls
    refreshInterval: 1h
    data:
      - secretKey: tls.crt
        remoteRef:
          key: argocd-agent-client-tls
          property: tls.crt
          version: latest
          decodingStrategy: Base64
      - secretKey: tls.key
        remoteRef:
          key: argocd-agent-client-tls
          property: tls.key
          version: latest
          decodingStrategy: Base64

