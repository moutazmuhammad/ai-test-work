############### required user input for dex:
# export BASE_DOMAIN="dev.plus.aib.vodafone.com"
# export OIDC_ISSUER="https://alert.dev.plus.aib.vodafone.com/realms/aibplus_realm"
# export OIDC_GROUPS_CUSTOM_SCOPE_NAME="groups"
# secret (dex-secret) in namespace (aib-auth) with fields:
#   DEX_OAUTH2_PROXY_CLIENT_ID
#   DEX_OAUTH2_PROXY_CLIENT_SECRET
#   DEX_OIDC_CLIENT_ID # created at NAM side
#   DEX_OIDC_CLIENT_SECRET # generated at NAM side

image:
  repository: europe-west1-docker.pkg.dev/vf-grp-aib-dev-mirror/aib-plus-images/dex
  pullPolicy: Always
  tag: "v2.45.1-alpine-3.24.1-fix"
  # pullPolicy: IfNotPresent
  # tag: "v2.44.0"

envFrom:
  - secretRef:
      name: dex-secret

commonLabels:
  app: dex

# aib-auth has istio-injection enabled, so — same as redis in aib-data — disable the
# sidecar on this pod rather than fight mTLS on the plaintext Prometheus scrape.
podAnnotations:
  sidecar.istio.io/inject: "false"
  aib.vodacom.co.za/sidecar-exemption-reason: "Istio sidecar disabled so the aib-ops Prometheus can scrape the plaintext telemetry port"

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
    - labelSelector:
        matchLabels:
          app: dex
      topologyKey: kubernetes.io/hostname

replicaCount: 3

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 1

podDisruptionBudget:
  enabled: true
  minAvailable: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

securityContext:
  runAsUser: 1001

envVars:
  - name: OIDC_ISSUER
    value: "https://login.ppent.vodacom.co.za/nidp/oauth/nam"
  - name: OIDC_GROUPS_CUSTOM_SCOPE_NAME
    value: "AIB"

config:
  issuer: "https://dex.dev.plus.aib.vodafone.com"
  logger:
    level: debug
    format: text
  storage:
    type: kubernetes
    config:
      inCluster: true # store state (clients, etc.) in k8s secrets
  web:
    http: 0.0.0.0:5556
  grpc:
    addr: 0.0.0.0:5557
  telemetry:
    http: 0.0.0.0:5558
  expiry:
    idTokens: "1h"
    refreshTokens:
      validIfNotUsedFor: "24h"
      absoluteLifetime: "168h"
  staticClients:
    - name: '{{ .Env.DEX_OAUTH2_PROXY_CLIENT_ID }}'
      id: '{{ .Env.DEX_OAUTH2_PROXY_CLIENT_ID }}'
      secret: '{{ .Env.DEX_OAUTH2_PROXY_CLIENT_SECRET }}'
      scopes:
        - openid
        - profile
        - email
        - '{{ .Env.OIDC_GROUPS_CUSTOM_SCOPE_NAME }}'
      redirectURIs:
        - https://auth.dev.plus.aib.vodafone.com/oauth2/callback
  connectors:
    - type: oidc
      id: AIBPlus
      name: AIB Plus
      config:
        issuer: '{{ .Env.OIDC_ISSUER }}'
        clientID: '{{ .Env.DEX_OIDC_CLIENT_ID }}'
        clientSecret: '{{ .Env.DEX_OIDC_CLIENT_SECRET }}'
        redirectURI: https://dex.dev.plus.aib.vodafone.com/callback
        scopes:
          - openid
          - profile
          - email
          - '{{ .Env.OIDC_GROUPS_CUSTOM_SCOPE_NAME }}'
        claimMapping:
          userIDKey: sub 
          userNameKey: preferred_username    
          preferred_username: preferred_username
          email: email
          name: name
          groups: '{{ .Env.OIDC_GROUPS_CUSTOM_SCOPE_NAME }}'
        insecureEnableGroups: true
        insecureSkipEmailVerified: true
        getUserInfo: true
        overrideClaimMapping: true
        providerDiscoveryOverrides:
          tokenURL: https://login.ppent.vodacom.co.za/nidp/oauth/nam/token?resourceServer=AIB

  oauth2:
    # DO NOT skip consent screen as it shows the mandatory legal disclaimer
    skipApprovalScreen: false 

  frontend:
    issuer: "AIB Plus"
    theme: "aibplus"
    dir: "/srv/dex/web"

serviceMonitor:
  enabled: true
  namespace: aib-auth
  interval: 30s

volumes:
  - name: theme-volume
    configMap:
      name: dex-aibplus-theme
  - name: theme-logo
    configMap:
      name: dex-aibplus-aib-logo
  - name: tmp
    emptyDir: {}

volumeMounts:
  - name: theme-volume
    mountPath: /srv/dex/web/themes/aibplus/styles.css
    subPath: styles.css
  - name: theme-logo
    mountPath: /srv/dex/web/themes/aibplus/logo.png
    subPath: logo.png
  - name: theme-logo
    mountPath: /srv/dex/web/themes/aibplus/favicon.png
    subPath: logo.png
  - name: tmp
    mountPath: /tmp
